    <style>
    /* Page style, adjust as you like. Neutral gray, light and dark mode follow the system setting. */
    :root {
        color-scheme: light dark;
        --page-bg: #f4f4f5; --card-bg: #fff; --border: #e4e4e7; --text: #18181b; --muted: #71717a;
        --green: #16a34a; --red: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
        :root { --page-bg: #18181b; --card-bg: #27272a; --border: #3f3f46; --text: #e4e4e7; --muted: #a1a1aa;
                --green: #15803d; --red: #b91c1c; }
    }
    body { margin: 0; padding: 32px 16px; background: var(--page-bg); color: var(--text);
           font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 20px; font-size: 24px; font-weight: 600; }
    /* Each server as a card. Side by side or below each other is decided by the box itself (container query). */
    main .mcstatusBox .mcstatusServer { padding: 16px 20px; background: var(--card-bg); border: 1px solid var(--border);
                                        border-radius: 12px; box-shadow: 0 1px 3px rgba(0, 0, 0, .06); }
    main .mcstatusBox .mcstatusTitle { margin-bottom: 8px; font-size: 16px; }
    main .mcstatusBox .mcstatusMessage, main .mcstatusBox .mcstatusFooter { color: var(--muted); }
    main .mcstatusBox .mcstatusFooter { margin-top: 12px; }

    /* CSS classes the status box uses from WSC (see wsc-box.html),
       defined here so the same box code works on any website. */
    dl.plain.dataList { display: grid; grid-template-columns: auto 1fr; margin: 0; }
    dl.plain.dataList dt, dl.plain.dataList dd { padding: 6px 0; border-top: 1px solid var(--border); }
    dl.plain.dataList dt:first-of-type, dl.plain.dataList dt:first-of-type + dd { border-top: 0; }
    dl.plain.dataList dt { padding-right: 15px; color: var(--muted); }
    dl.plain.dataList dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .badge { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.7; color: #fff; background: var(--muted); }
    .badge.label.green { background: var(--green); }
    .badge.label.red { background: var(--red); }
    </style>

<body>
    <!--<script src="scripts.js"></script>-->
<main>
    <h1>Minecraft Server</h1>

<!--
    Minecraft server status box (mcstatus-httpd), same code as wsc-box.html.
    https://github.com/Tob1as/mcstatus-httpd

    Customizing:
      - Adjust MCSTATUS_URL in the script below.
        Optional settings there: REFRESH_SECONDS, DATE_FORMAT, LANGUAGE, SHOW_AVATARS, AVATAR_TYPE, AVATAR_SIZE and TEXTS.
      - Remove a whole <section> if you do not run that server (Java or Bedrock).
      - Remove any <dt>/<dd> pair you do not need, the script skips missing fields.
      - Texts in English and German (TEXTS in the script), the language is chosen automatically
        (language of the browser). To add a language, copy the 'en' block of TEXTS.
      - Fields without a value (e.g. empty player list) are hidden automatically.
-->
<style>
.mcstatusBox [hidden] { display: none !important; }
/* Java and Bedrock side by side if the box is wide enough (e.g. footer or own page), otherwise
   below each other (e.g. sidebar or phone). The box width counts, not the screen width. */
.mcstatusBox { container: mcstatus / inline-size; }
.mcstatusBox .mcstatusServers { display: grid; gap: 15px 30px; }
@container mcstatus (min-width: 560px) {
    .mcstatusBox .mcstatusServers { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
}
.mcstatusBox .mcstatusTitle { font-size: inherit; font-weight: 600; margin: 0 0 5px; }
.mcstatusBox [data-field="motd"] { white-space: pre-line; }
/* Footer: time of the last query on the left, link to the project (GitHub icon) on the right. */
.mcstatusBox .mcstatusFooter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: smaller; }
.mcstatusBox .mcstatusUpdated { margin: 0; opacity: .7; }
.mcstatusBox .mcstatusSource { position: relative; margin-left: auto; color: inherit; text-decoration: none; line-height: 0; }
.mcstatusBox .mcstatusSource svg { width: 16px; height: 16px; fill: currentColor; opacity: .7; }
.mcstatusBox .mcstatusSource:hover svg, .mcstatusBox .mcstatusSource:focus-visible svg { opacity: 1; }
/* Player avatars, the name is shown as tooltip on mouse over and on tap (focus). */
.mcstatusBox .mcstatusAvatars { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 4px; }
.mcstatusBox .mcstatusAvatar { position: relative; margin: 0; padding: 0; border: 0; background: none; box-shadow: none; cursor: pointer; line-height: 0; appearance: none; }
.mcstatusBox .mcstatusAvatar img { display: block; width: auto; image-rendering: pixelated; }
/* Tooltips: player name of an avatar (mouse over and tap) and link of the GitHub icon. */
.mcstatusBox .mcstatusAvatar::after, .mcstatusBox .mcstatusSource::after { content: attr(data-name); position: absolute; bottom: calc(100% + 4px); right: 0; padding: 2px 6px; border-radius: 3px; background: rgba(0, 0, 0, .8); color: #fff; font-size: 12px; line-height: 1.4; white-space: nowrap; pointer-events: none; visibility: hidden; z-index: 10; }
.mcstatusBox .mcstatusAvatar:hover::after, .mcstatusBox .mcstatusAvatar:focus::after,
.mcstatusBox .mcstatusSource:hover::after, .mcstatusBox .mcstatusSource:focus-visible::after { visibility: visible; }
</style>

<div class="mcstatusBox">
    <p class="mcstatusMessage" data-text="loading">Loading ...</p>

    <div class="mcstatusServers">
        <!-- Minecraft Java Edition -->
        <section class="mcstatusServer" data-server="java" hidden>
            <h3 class="mcstatusTitle" data-text="java">Java Edition</h3>
            <dl class="plain dataList">
                <dt data-text="status">Status</dt>          <dd data-field="status"></dd>
                <dt data-text="address">Address</dt>        <dd data-field="address"></dd>
                <dt data-text="port">Port</dt>              <dd data-field="port"></dd>
                <dt data-text="players">Players</dt>        <dd data-field="players"></dd>
                <dt data-text="playerList">Player list</dt> <dd data-field="playerList"></dd>
                <dt data-text="version">Version</dt>        <dd data-field="version"></dd>
                <dt data-text="software">Software</dt>      <dd data-field="brand"></dd>
                <dt data-text="plugins">Plugins</dt>        <dd data-field="plugins"></dd>
                <dt data-text="map">Map</dt>                <dd data-field="map"></dd>
                <dt data-text="motd">MOTD</dt>              <dd data-field="motd"></dd>
            </dl>
        </section>

        <!-- Minecraft Bedrock Edition -->
        <section class="mcstatusServer" data-server="bedrock" hidden>
            <h3 class="mcstatusTitle" data-text="bedrock">Bedrock Edition</h3>
            <dl class="plain dataList">
                <dt data-text="status">Status</dt>          <dd data-field="status"></dd>
                <dt data-text="address">Address</dt>        <dd data-field="address"></dd>
                <dt data-text="port">Port</dt>              <dd data-field="port"></dd>
                <dt data-text="players">Players</dt>        <dd data-field="players"></dd>
                <dt data-text="version">Version</dt>        <dd data-field="version"></dd>
                <dt data-text="gamemode">Game mode</dt>     <dd data-field="gamemode"></dd>
                <dt data-text="map">Map</dt>                <dd data-field="map"></dd>
                <dt data-text="motd">MOTD</dt>              <dd data-field="motd"></dd>
            </dl>
        </section>
    </div>

    <!-- Time of the last query and link to the project (the <a> is optional) -->
    <div class="mcstatusFooter">
        <p class="mcstatusUpdated" hidden><span data-text="lastUpdate">Last update</span>: <span data-field="date"></span></p>
        <a class="mcstatusSource" href="https://github.com/Tob1as/mcstatus-httpd" target="_blank" rel="noopener noreferrer"
           aria-label="github.com/Tob1as/mcstatus-httpd" data-name="github.com/Tob1as/mcstatus-httpd">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
    </div>
</div>
<script>
(() => {
    // ---- Configuration -----------------------------------------------------
    // URL of mcstatus-httpd, including HTTP_PREFIX if used, e.g.
    // 'https://example.com/mcstatus' (must be HTTPS if this page uses HTTPS).
    const MCSTATUS_URL = 'http://example.com:8080/';
    // Reload the status every X seconds, 0 = load only once.
    const REFRESH_SECONDS = 60;
    // Date format of "Last update" (shown in the local time of the visitor):
    //   ''      = language of the page (<html lang="...">), otherwise of the browser
    //   'de-DE' = fixed language, e.g. 'de-DE' -> 03.11.2026, 22:49 / 'en-US' -> 11/03/2026, 10:49 PM
    //   'iso'   = 2026-11-03 22:49
    const DATE_FORMAT = '';
    // Language of the texts: '' = automatic, or fixed, e.g. 'de'.
    // Automatic: language of the page (<html lang="...">, in WSC the language of the user),
    // without it the language of the browser. A language missing in TEXTS shows English.
    const LANGUAGE = '';
    // Show avatars instead of player names (Java), only works if mcstatus-httpd
    // provides them (AVATAR_ENABLE), otherwise the names are shown as text.
    const SHOW_AVATARS = true;
    // Avatar type: '' = default of mcstatus-httpd (AVATAR_TYPE), 'head', 'body', 'head3d' or 'body3d'.
    // Only used if mcstatus-httpd allows it (AVATAR_ALLOWED_TYPES), otherwise its default.
    const AVATAR_TYPE = '';
    // Height of a head avatar in pixels, body avatars (body, body3d) are 2.5 times as high.
    const AVATAR_SIZE = 20;
    // Texts per language (labels with data-text="..." in the HTML and texts of the script).
    // To add a language, copy the 'en' block (e.g. as fr: { ... }) and translate the values,
    // missing texts are taken from 'en'.
    const TEXTS = {
        en: {
            loading: 'Loading ...', error: 'Status currently not available.', noServer: 'No server configured.',
            online: 'Online', offline: 'Offline', lastUpdate: 'Last update',
            java: 'Java Edition', bedrock: 'Bedrock Edition',
            status: 'Status', address: 'Address', port: 'Port', players: 'Players', playerList: 'Player list',
            version: 'Version', software: 'Software', plugins: 'Plugins', gamemode: 'Game mode', map: 'Map', motd: 'MOTD',
        },
        de: {
            loading: 'Wird geladen ...', error: 'Status derzeit nicht abrufbar.', noServer: 'Kein Server konfiguriert.',
            online: 'Online', offline: 'Offline', lastUpdate: 'Letzte Aktualisierung',
            java: 'Java Edition', bedrock: 'Bedrock Edition',
            status: 'Status', address: 'Adresse', port: 'Port', players: 'Spieler', playerList: 'Spielerliste',
            version: 'Version', software: 'Software', plugins: 'Plugins', gamemode: 'Spielmodus', map: 'Welt', motd: 'MOTD',
        },
    };
    // ------------------------------------------------------------------------

    // This script must be placed directly after <div class="mcstatusBox">,
    // so several boxes can be used on the same page.
    const box = document.currentScript?.previousElementSibling;
    if (!box?.classList.contains('mcstatusBox')) {
        console.error('mcstatus: <div class="mcstatusBox"> must be placed directly before the script.');
        return;
    }

    // Language: LANGUAGE, otherwise the page language, without it the browser languages, fallback English.
    // Only the main language counts, e.g. 'de-AT' -> 'de'.
    const wanted = LANGUAGE || document.documentElement.lang;
    const language = (wanted ? [wanted] : navigator.languages || [navigator.language])
        .map((code) => String(code).toLowerCase().split('-')[0])
        .find((code) => TEXTS[code]) || 'en';
    const TEXT = { ...TEXTS.en, ...TEXTS[language] };
    box.querySelectorAll('[data-text]').forEach((element) => {
        element.textContent = TEXT[element.dataset.text] ?? element.textContent;
    });
    const message = box.querySelector('.mcstatusMessage');
    const updated = box.querySelector('.mcstatusUpdated');
    // Avatars are loaded relative to MCSTATUS_URL, e.g. '/mcstatus' -> '/mcstatus/avatar/<name>'.
    const avatarBase = new URL(MCSTATUS_URL.endsWith('/') ? MCSTATUS_URL : `${MCSTATUS_URL}/`, document.baseURI);

    // Write a value into a field and show it together with its label (<dt>).
    // Empty values hide field and label, missing fields are skipped.
    // textContent is used instead of innerHTML, so values from the Minecraft
    // server (MOTD, player names) cannot inject HTML into the page.
    const setField = (parent, name, value) => {
        const field = parent.querySelector(`[data-field="${name}"]`);
        if (!field) {
            return;
        }
        const empty = value === null || value === undefined || value === ''
            || (Array.isArray(value) && value.length === 0);
        const label = field.tagName === 'DD' ? field.previousElementSibling : null;
        field.hidden = empty;
        if (label) {
            label.hidden = empty;
        }
        if (empty) {
            return;
        }
        if (value instanceof Node) {
            field.replaceChildren(value);
        } else {
            field.textContent = Array.isArray(value) ? value.join(', ') : String(value);
        }
    };

    // Status badge (green = online, red = offline).
    const statusBadge = (online) => {
        const badge = document.createElement('span');
        badge.className = `badge label ${online ? 'green' : 'red'}`;
        badge.textContent = online ? TEXT.online : TEXT.offline;
        return badge;
    };

    // Format a date according to DATE_FORMAT.
    const formatDate = (date) => {
        if (DATE_FORMAT === 'iso') {
            const pad = (number) => String(number).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} `
                + `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }
        const locale = DATE_FORMAT || document.documentElement.lang || undefined;
        const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
        try {
            return date.toLocaleString(locale, options);
        } catch {
            return date.toLocaleString(undefined, options);  // invalid language -> browser language
        }
    };

    const showMessage = (text) => {
        if (message) {
            message.textContent = text;
            message.hidden = !text;
        }
    };

    // Player list as avatars (if enabled in mcstatus-httpd and SHOW_AVATARS) or as names.
    // "avatar" is the avatar info of the JSON, e.g. {"type": "head", "types": ["head", "body"], "path": "/mcstatus/avatar/"}.
    const playerList = (names, avatar) => {
        if (!SHOW_AVATARS || !avatar || !Array.isArray(names) || names.length === 0) {
            return names;
        }
        const type = AVATAR_TYPE && (avatar.types || []).includes(AVATAR_TYPE) ? AVATAR_TYPE : avatar.type;
        const height = Math.round(AVATAR_SIZE * (type.startsWith('body') ? 2.5 : 1));
        const list = document.createElement('span');
        list.className = 'mcstatusAvatars';
        for (const name of names) {
            // A button can get the focus, so the tooltip (CSS) also appears on tap.
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'mcstatusAvatar';
            button.dataset.name = name;
            button.setAttribute('aria-label', name);

            const image = document.createElement('img');
            // The type is always sent: browsers cache avatars per URL, so a changed
            // default type of mcstatus-httpd does not show cached avatars of the other type.
            image.src = new URL(`avatar/${encodeURIComponent(name)}?type=${encodeURIComponent(type)}`, avatarBase).href;
            image.alt = name;
            image.height = height;
            image.loading = 'lazy';
            // No avatar available: show the name as text instead (own element, so the gap stays).
            image.addEventListener('error', () => {
                const text = document.createElement('span');
                text.textContent = name;
                button.replaceWith(text);
            }, { once: true });

            button.append(image);
            list.append(button);
        }
        return list;
    };

    const renderServer = (type, server, avatar) => {
        const section = box.querySelector(`[data-server="${type}"]`);
        if (!section) {
            return;  // section removed from the HTML
        }
        section.hidden = !server;  // server not configured in mcstatus-httpd
        if (!server) {
            return;
        }

        const online = server.online === true;
        const players = server.players ?? {};
        const software = server.software ?? {};

        setField(section, 'status', statusBadge(online));
        setField(section, 'address', server.hostname);
        setField(section, 'port', server.port);
        // All other values are only available while the server is online.
        setField(section, 'players', online ? `${players.online} / ${players.max}` : null);
        setField(section, 'playerList', online ? playerList(players.list, avatar) : null);
        setField(section, 'version', online ? software.version : null);
        setField(section, 'brand', online ? software.brand : null);
        setField(section, 'plugins', online ? software.plugins : null);
        setField(section, 'gamemode', online ? server.gamemode : null);
        setField(section, 'map', online ? server.map : null);
        setField(section, 'motd', online ? server.motd : null);
    };

    const update = async () => {
        try {
            const response = await fetch(MCSTATUS_URL, {
                cache: 'no-store',
                signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();

            // Avatar info of the JSON disabled, fixed values instead.
            //renderServer('java', data.java, data.avatar);
            //renderServer('bedrock', data.bedrock, data.avatar);
            const avatar = { type: 'head', types: ['head', 'body', 'head3d', 'body3d'] };
            renderServer('java', data.java, avatar);
            renderServer('bedrock', data.bedrock, avatar);

            showMessage(data.java || data.bedrock ? '' : TEXT.noServer);

            if (updated) {
                const date = new Date(data.date);
                const formatted = Number.isNaN(date.getTime()) ? null : formatDate(date);
                setField(updated, 'date', formatted);
                updated.hidden = !formatted;
            }
        } catch (error) {
            box.querySelectorAll('.mcstatusServer').forEach((section) => {
                section.hidden = true;
            });
            if (updated) {
                updated.hidden = true;
            }
            showMessage(TEXT.error);
            console.error('mcstatus:', error);
        }
    };

    update();
    if (REFRESH_SECONDS > 0) {
        setInterval(update, REFRESH_SECONDS * 1000);
    }
})();
</script>
</main>

</body>
</html>
