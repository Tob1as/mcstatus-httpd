<!--
    Minimal example for mcstatus-httpd (https://github.com/Tob1as/mcstatus-httpd):
    shows the status of the servers as plain text, no design.
    Player names are shown when the server sends them (Query or player sample of the status).
-->
<pre id="mcstatus">Loading ...</pre>

<script>
// Address of mcstatus-httpd
const MCSTATUS_URL = 'http://example.com:8080/';
const REFRESH_SECONDS = 60;

async function showStatus() {
    const output = document.getElementById('mcstatus');
    try {
        const response = await fetch(MCSTATUS_URL);
        const data = await response.json();
        let text = '';
        for (const [name, server] of [['Java', data.java], ['Bedrock', data.bedrock]]) {
            if (!server) continue;  // this server is not configured in mcstatus-httpd
            text += `${name}: ${server.hostname}:${server.port}\n`;
            if (server.online) {
                text += 'Status: Online\n';
                text += `Players: ${server.players.online} / ${server.players.max}\n`;
                if (server.players.list?.length) {
                    text += `Names: ${server.players.list.join(', ')}\n`;
                }
            } else {
                text += 'Status: Offline\n';
            }
            text += '\n';
        }
        // textContent (not innerHTML): names from the server are shown as text, never as HTML.
        output.textContent = text;
    } catch (error) {
        output.textContent = 'Status not available.';
    }
}

showStatus();
setInterval(showStatus, REFRESH_SECONDS * 1000);
</script>
