# nginx for the test environment, uses njs (included in the official nginx image).
load_module modules/ngx_http_js_module.so;

events {}

http {
    include mime.types;
    charset utf-8;  # HTML snippets without <meta charset> (own languages with special characters)
    js_path /etc/nginx/njs/;
    js_import mock from mock.js;

    server {
        listen 80;

        # Overview page and avatar check.
        location = / {
            root /test;
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }
        location = /avatar-check.html {
            root /test;
            add_header Cache-Control "no-store";
        }

        # WSC test page (look of a WSC forum, wsc/frame.html): the example page is included by SSI
        # in the sidebar, in the footer boxes or as own page, e.g. /wsc/sidebar/live/wsc-box.html
        location ~ ^/wsc/(?<position>sidebar|footer|page)/(?<scenario>[a-z0-9-]+)/(?<page>wsc-box[a-z0-9-]*\.html)$ {
            root /test/wsc;
            try_files /frame.html =404;
            ssi on;
            add_header Cache-Control "no-store";
        }
        location = /wsc/wsc.css {
            root /test;
            add_header Cache-Control "no-store";
        }
        # Icons of examples/icons (box image of the WSC test page)
        location /icons/ {
            root /usr/share/nginx/html;
        }

        # Example pages per scenario, MCSTATUS_URL points to the scenario, refresh every 10 s.
        location ~ ^/s/(?<scenario>[a-z0-9-]+)/(?<page>[a-z0-9-]+\.html)$ {
            alias /usr/share/nginx/html/$page;
            sub_filter "const MCSTATUS_URL = '/mcstatus';" "const MCSTATUS_URL = '/s/$scenario/mcstatus';";
            sub_filter "const MCSTATUS_URL = 'http://example.com:8080/';" "const MCSTATUS_URL = '/s/$scenario/mcstatus';";
            sub_filter "const REFRESH_SECONDS = 60;" "const REFRESH_SECONDS = 10;";
            add_header Cache-Control "no-store";
        }

        # Live data of mcstatus-httpd (demo servers), incl. avatars and healthcheck.
        location ~ ^/s/live/mcstatus(/.*)?$ {
            rewrite ^/s/live/mcstatus(.*)$ /mcstatus$1 break;
            proxy_pass http://mcstatus-httpd:8080;
        }

        # Random JSON on every request (mock.js).
        location ~ ^/s/random/mcstatus/?$ {
            js_content mock.status;
        }

        # Error of mcstatus-httpd / reverse proxy.
        location ~ ^/s/error/mcstatus/?$ {
            return 500;
        }

        # Fixed JSON files of scenarios/.
        location ~ ^/s/(?<scenario>[a-z0-9-]+)/mcstatus/?$ {
            default_type application/json;
            alias /test/scenarios/$scenario.json;
            add_header Cache-Control "no-store";
        }

        # Avatars of the mock scenarios from mcstatus-httpd (any name, AVATAR_ONLINE_ONLY=0).
        location ~ ^/s/[a-z0-9-]+/mcstatus/avatar/ {
            rewrite ^/s/[a-z0-9-]+/mcstatus/(avatar/.*)$ /mcstatus/$1 break;
            proxy_pass http://mcstatus-httpd:8080;
        }
    }
}
