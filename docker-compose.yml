services:

  mcstatus-httpd:
    #build:
    #  args:
    #    - VCS_REF=${VCS_REF:-unknown}
    #    - BUILD_DATE=${BUILD_DATE:-unknown}
    #    - VERSION=${VERSION:-dev}
    #  context: ./
    #  dockerfile: Dockerfile
    #  target: production
    image: ghcr.io/tob1as/mcstatus-httpd:latest
    container_name: mcstatus-httpd
    restart: unless-stopped
    ports:
      - 8080:8080/tcp
    #volumes:
    #  - ./mcstatus-httpd.py:/app/mcstatus-httpd.py:ro
    #  - ./ssl/ssl.crt:/app/ssl.crt:ro
    #  - ./ssl/ssl.key:/app/ssl.key:ro
    #  - mcstatus-cache:/tmp/mcstatus-httpd:rw  # with AVATAR_CACHE_TYPE/PLAYER_UUID_CACHE_TYPE: file, keeps avatars and UUIDs when the container is recreated
    environment:
      #TZ: Europe/Berlin
      # Demo servers of https://mcstatus.io - replace with your own servers.
      MINECRAFT_JAVA_SERVER: demo.mcstatus.io
      MINECRAFT_JAVA_SERVER_PORT: 25565
      #MINECRAFT_JAVA_SERVER_PORT_QUERY: 25565  # set, if UDP (query) is not equal to TCP port
      #MINECRAFT_JAVA_SERVER_OVERWRITE: minecraft.example.com
      MINECRAFT_BEDROCK_SERVER: demo.mcstatus.io
      MINECRAFT_BEDROCK_SERVER_PORT: 19132
      #MINECRAFT_BEDROCK_SERVER_OVERWRITE: minecraft-bedrock.example.com
      #MINECRAFT_BEDROCK_TRANSPORT: auto  # nethernet (TCP, Bedrock >= 1.26.50), raknet (UDP, legacy) or auto (both)
      #MINECRAFT_TIMEOUT: 3        # seconds until a server counts as offline
      #CACHE_TTL: 10               # seconds a result is reused, 0 = query on every request
      #HTTP_HOST: "::"             # listen on IPv4 + IPv6 (default 0.0.0.0 = IPv4 only)
      #HTTP_PREFIX: mcstatus       # -> http://localhost:8080/mcstatus
      #HTTP_CORS_ORIGIN: "*"       # websites allowed to load the status, e.g. https://forum.example.com,https://example.com
      #HTTP_TRUSTED_PROXIES: "172.18.0.0/16, 10.0.0.5, fd00:dead:beef::/48, ::1"  # reverse proxies (IPv4/IPv6 networks or IPs), client IP from X-Forwarded-For in the log
      #HTTPD_SSL_ENABLE: 1
      #SSL_CERTFILE: ssl.crt
      #SSL_KEYFILE: ssl.key
      #AVATAR_ENABLE: 1                     # player avatars (Java) at <prefix>/avatar/<name>, loaded and cached by mcstatus-httpd
      #AVATAR_TYPE: head                    # default type: head, body, head3d or body3d
      #AVATAR_IMAGE_SIZE: 64                # default image width in pixels loaded from the providers (8-300)
      #AVATAR_ALLOWED_TYPES: head,body,head3d,body3d  # types allowed via ?type=
      #AVATAR_ALLOWED_SIZES: 16,32,48,64,96,128,192,256,300  # sizes allowed via ?size=
      #AVATAR_PROVIDERS: mc-heads,minotar,crafthead  # order of preference (fallback), or own URL templates with {name}/{id} and {size}, optional "head="/"body="/... prefix
      #AVATAR_CACHE_TTL: 3600               # seconds until an avatar is loaded again (the old one is kept if that fails)
      #AVATAR_CACHE_TYPE: memory            # memory or file (see volumes)
      #AVATAR_CACHE_DIR: /tmp/mcstatus-httpd/avatars
      #AVATAR_CACHE_MAX_ENTRIES: 500        # 0 = unlimited
      #AVATAR_TLS_VERIFY: 0                 # accept self-signed HTTPS certificates of own URL templates
      #AVATAR_ONLINE_ONLY: 0                # serve avatars of any player name, not only of online players
      #AVATAR_TYPE_FALLBACK: 1              # flat avatar if a 3D avatar is not available (head3d -> head, body3d -> body)
      #PLAYER_UUID_LOOKUP: 1                # look up player UUIDs for the avatar providers ({id}), 0 = always use the name
      #PLAYER_UUID_PROVIDERS: mojang,minecraftservices,playerdb,minetools  # order of preference (fallback)
      #PLAYER_UUID_CACHE_TTL: 86400         # seconds until a UUID is looked up again (the old one is kept if that fails)
      #PLAYER_UUID_CACHE_TYPE: memory       # memory or file (see volumes)
      #PLAYER_UUID_CACHE_FILE: /tmp/mcstatus-httpd/uuids.json
      #PLAYER_UUID_CACHE_MAX_ENTRIES: 1000  # 0 = unlimited
      #LOGLEVEL: INFO
    # Works with the distroless and the alpine image, no wget/curl needed.
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "/app/mcstatus-httpd.py", "--healthcheck"]       # distroless image (Dockerfile)
      #test: ["CMD", "/usr/local/bin/python3", "/app/mcstatus-httpd.py", "--healthcheck"] # alpine image (alpine.Dockerfile)
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

#volumes:
#  mcstatus-cache:
