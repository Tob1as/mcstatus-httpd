name: 'build docker images: mcstatus-httpd'

on:
  #push:
  #  branches:
  #    - 'main'
  #    - 'master'
  # Release: push a version tag, e.g. "git tag v2.0.0 && git push origin v2.0.0"
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Dev build: start manually in the GitHub GUI (Actions -> Run workflow -> branch main)
  workflow_dispatch:
  schedule:
    - cron: '45 5 28 * *'  # At 05:45 on day-of-month 28 (dev build of the default branch).

defaults:
  run:
    shell: bash

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell-Script
        id: script
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_DATE_NUMERIC="${BUILD_DATE//[^[:digit:]]/}"
          COMMIT_HASH=${GITHUB_SHA::8}
          GITHUB_REPO=${GITHUB_REPOSITORY,,}
          GITHUB_REPO_SHORT=${GITHUB_REPO#*/}
          #DOCKER_REPO=${{ secrets.DOCKER_USERNAME }}/${GITHUB_REPO_SHORT}
          #REDHAT_QUAY_REPO=${{ secrets.REDHAT_QUAY_USERNAME }}/${GITHUB_REPO_SHORT}

          # Version shown by the application:
          #   release (tag v2.0.0) -> 2.0.0
          #   dev build            -> <build date>.<commit hash>
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${BUILD_DATE_NUMERIC}.${COMMIT_HASH}"
          fi
          
          # Set output parameters to action.
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "build_date_numeric=${BUILD_DATE_NUMERIC}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "github_repo=${GITHUB_REPO}" >> "$GITHUB_OUTPUT"
          echo "docker_repo=${DOCKER_REPO}" >> "$GITHUB_OUTPUT"
          echo "redhat_quay_repo=${REDHAT_QUAY_REPO}" >> "$GITHUB_OUTPUT"

      # Image tags:
      #   release (tag v2.0.0):     2.0.0, 2.0, 2, latest  (pre-release v2.0.0-rc1: only 2.0.0-rc1)
      #   dev build (GUI/schedule): dev
      #   every build:              <build date>.<commit hash>, <commit hash>
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.script.outputs.github_repo }}
          #  docker.io/${{ steps.script.outputs.docker_repo }}
          #  quay.io/${{ steps.script.outputs.redhat_quay_repo }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=dev,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=${{ steps.script.outputs.build_date_numeric }}.${{ steps.script.outputs.commit_hash }}
            type=raw,value=${{ steps.script.outputs.commit_hash }}

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Login to DockerHub 
      #  uses: docker/login-action@v3
      #  with:
      #    registry: docker.io
      #    username: ${{ secrets.DOCKER_USERNAME }}
      #    password: ${{ secrets.DOCKER_PASSWORD }}

      #- name: Login to RED HAT Quay.io Container Registry
      #  uses: docker/login-action@v3
      #  with:
      #    registry: quay.io
      #    username: ${{ secrets.REDHAT_QUAY_USERNAME }}
      #    password: ${{ secrets.REDHAT_QUAY_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          target: production
          build-args: |
            BUILD_DATE=${{steps.script.outputs.build_date}}
            VCS_REF=${{steps.script.outputs.commit_hash}}
            VERSION=${{steps.script.outputs.version}}
          tags: ${{ steps.meta.outputs.tags }}

  release:
    # Only for pushed version tags and only if the Docker image was built successfully.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archives
        id: archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="mcstatus-httpd-${VERSION}"
          mkdir -p "dist/${NAME}"
          cp mcstatus-httpd.py requirements.txt README.md LICENSE "dist/${NAME}/"

          # Set the release version as default in the packaged script (instead of "dev").
          sed -i -E "s/^DEFAULT_VERSION: Final = \"dev\"(\r?)$/DEFAULT_VERSION: Final = \"${VERSION}\"\1/" "dist/${NAME}/mcstatus-httpd.py"
          grep -q "^DEFAULT_VERSION: Final = \"${VERSION}\"" "dist/${NAME}/mcstatus-httpd.py"

          cd dist
          tar -czf "${NAME}.tar.gz" "${NAME}"
          zip -rq "${NAME}.zip" "${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          PRERELEASE=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE=(--prerelease)  # e.g. v2.0.0-rc1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ARCHIVE_NAME}.tar.gz" \
            "dist/${ARCHIVE_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "${PRERELEASE[@]}"
